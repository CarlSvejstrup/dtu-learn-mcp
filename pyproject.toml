[project]
name = "dtu-learn"
version = "0.2.0"
description = "Your DTU Learn (Brightspace) courses on disk, in your notes, and in your AI assistant via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Carl Schmidt-Svejstrup" }]
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "html2text>=2024.2",
    "mcp>=1.2,<2",
    "pypdf>=4",
    "tzdata",
]

[project.scripts]
dtu-learn = "dtulearn.cli:main"

[project.urls]
Repository = "https://github.com/CarlSvejstrup/dtu-learn-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtulearn"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
